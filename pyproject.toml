[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ats-mcp"
version = "0.1.0"
description = "MCP server for the ATS (Advanced Terrestrial Simulator) repository"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
ats-mcp = "ats_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ats_mcp"]
